<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aerial</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0a0a; color: #e0e0e0;
        -webkit-text-size-adjust: 100%;
      }

      .container { max-width: 1100px; margin: 0 auto; padding: 16px; }

      h1 { font-size: 1.6rem; margin-bottom: 4px; color: #fff; }

      .tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid #333; overflow-x: auto; }
      .tab {
        padding: 10px 16px; cursor: pointer; color: #888;
        border-bottom: 2px solid transparent; transition: all 0.2s;
        white-space: nowrap; font-size: 0.9rem;
      }
      .tab:hover { color: #ccc; }
      .tab.active { color: #fff; border-bottom-color: #6366f1; }

      .tab-content { display: none; }
      .tab-content.active { display: block; }

      /* Navigation bar */
      .nav-bar {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 12px; gap: 8px; flex-wrap: wrap;
      }
      .nav-group { display: flex; gap: 6px; align-items: center; }
      .nav-bar .status { color: #666; font-size: 0.8rem; flex: 1; text-align: center; min-width: 0; }

      /* Day headers */
      .day-header {
        padding: 12px 0 6px; font-weight: 600; font-size: 1rem;
        color: #a5b4fc; border-bottom: 1px solid #1e1e2e; margin-top: 14px;
      }

      /* Class rows - card-style on mobile */
      .class-row {
        display: grid;
        grid-template-columns: 110px 1fr 150px 80px auto;
        align-items: center; padding: 10px 8px;
        border-bottom: 1px solid #1a1a2e; transition: background 0.15s; gap: 8px;
      }
      .class-row:hover { background: #151525; }

      .class-time { color: #94a3b8; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
      .class-name { font-weight: 500; font-size: 0.9rem; }
      .class-teacher { color: #888; font-size: 0.8rem; }
      .class-spots { font-size: 0.8rem; font-variant-numeric: tabular-nums; }
      .class-spots.full { color: #ef4444; }
      .class-spots.open { color: #22c55e; }
      .class-spots.unknown { color: #666; }
      .class-actions { text-align: right; white-space: nowrap; }
      .class-mobile-meta { display: none; color: #888; font-size: 0.75rem; margin-top: 2px; }

      /* Buttons */
      button {
        padding: 6px 12px; border: none; border-radius: 6px;
        cursor: pointer; font-size: 0.8rem; font-weight: 500;
        transition: all 0.15s; white-space: nowrap;
      }
      .btn-nav { background: #1e1e2e; color: #ccc; border: 1px solid #333; }
      .btn-nav:hover { background: #2a2a3e; }
      .btn-nav:active { background: #353550; }
      .btn-book { background: #22c55e; color: #000; }
      .btn-book:hover { background: #16a34a; }
      .btn-watch { background: #6366f1; color: #fff; }
      .btn-watch:hover { background: #4f46e5; }
      .btn-unwatch { background: #ef4444; color: #fff; }
      .btn-unwatch:hover { background: #dc2626; }
      .btn-refresh { background: #1e1e2e; color: #a5b4fc; border: 1px solid #333; }
      .btn-refresh:hover { background: #2a2a3e; }
      .btn-refresh.spinning svg { animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .btn-small { padding: 5px 10px; font-size: 0.75rem; }

      /* Watchlist */
      .watchlist-item {
        display: grid; grid-template-columns: 1fr 130px 120px 80px;
        align-items: center; padding: 12px 8px; border-bottom: 1px solid #1a1a2e;
        gap: 8px;
      }
      .wl-mobile-meta { display: none; }
      .wl-status { padding: 3px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: 600; display: inline-block; }
      .status-waiting { background: #1e1b4b; color: #a5b4fc; }
      .status-booked { background: #052e16; color: #4ade80; }
      .status-reauth { background: #422006; color: #fbbf24; }
      .status-booking { background: #1e1b4b; color: #818cf8; animation: pulse 1.5s infinite; }
      .phase-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; }
      .dot-scheduled { background: #6366f1; }
      .dot-reauth { background: #fbbf24; }
      .dot-booking { background: #22c55e; animation: pulse 1s infinite; }
      .dot-done { background: #4ade80; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

      /* Debug */
      .debug-section { border: 1px solid #1a1a2e; border-radius: 8px; margin-bottom: 12px; background: #0f0f1a; }
      .debug-section > summary {
        display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none;
        padding: 12px 14px; font-size: 0.85rem; font-weight: 600; color: #ccc; user-select: none;
      }
      .debug-section > summary::-webkit-details-marker { display: none; }
      .debug-section > summary::before { content: '▸'; color: #6366f1; font-size: 0.7rem; transition: transform 0.15s; }
      .debug-section[open] > summary::before { transform: rotate(90deg); }
      .debug-section > div { padding: 0 14px 14px; }
      .job-row {
        display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline;
        padding: 10px 0; border-top: 1px solid #1a1a2e; font-size: 0.82rem;
      }
      .job-id { color: #e5e7eb; font-family: 'SF Mono', 'Fira Code', monospace; }
      .job-next { color: #a5b4fc; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .job-next.paused { color: #f87171; }
      .job-trigger { grid-column: 1 / -1; color: #64748b; font-size: 0.72rem; font-family: 'SF Mono', monospace; }
      .debug-meta { color: #64748b; font-size: 0.75rem; padding: 4px 0 8px; }
      .fc-row {
        display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline;
        padding: 10px 0; border-top: 1px solid #1a1a2e; font-size: 0.82rem;
      }
      .fc-name { color: #e5e7eb; }
      .fc-meta { grid-column: 1 / -1; color: #64748b; font-size: 0.72rem; }
      .fc-badge { padding: 2px 9px; border-radius: 12px; font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
      .fc-open { background: #052e16; color: #4ade80; }
      .fc-full { background: #2a2030; color: #c084fc; }
      .fc-other { background: #422006; color: #fbbf24; }

      .loading { text-align: center; padding: 40px; color: #666; }
      .boot-log {
        text-align: left; padding: 20px 24px; color: #555; font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 0.75rem; line-height: 1.7; max-height: 300px; overflow-y: auto;
      }
      .boot-log .log-line { color: #6366f1; opacity: 0; animation: fadeIn 0.2s forwards; }
      .boot-log .log-line:last-child { color: #a5b4fc; }
      @keyframes fadeIn { to { opacity: 1; } }
      .empty { text-align: center; padding: 30px; color: #555; font-size: 0.9rem; }

      .toast {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        padding: 10px 20px; background: #1e1e2e; border: 1px solid #333;
        border-radius: 8px; color: #fff; font-size: 0.85rem; z-index: 100;
        opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90vw;
      }
      .toast.show { opacity: 1; }

      /* Mobile */
      @media (max-width: 640px) {
        .container { padding: 12px; }
        h1 { font-size: 1.3rem; }
        .class-row {
          grid-template-columns: 1fr auto;
          padding: 12px 4px; gap: 4px;
        }
        .class-teacher, .class-spots { display: none; }
        .class-mobile-meta { display: block; }
        .class-name { font-size: 0.85rem; }
        .nav-bar { gap: 6px; }
        .nav-bar .status { font-size: 0.7rem; }
        button { padding: 8px 12px; font-size: 0.8rem; }
        .btn-small { padding: 8px 12px; }

        .watchlist-item { grid-template-columns: 1fr auto; gap: 4px; }
        .wl-date, .wl-time, .wl-header-date, .wl-header-time { display: none; }
        .wl-mobile-meta { display: block; color: #888; font-size: 0.72rem; margin-top: 3px; }

      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Aerial
        <span id="authIcon" onclick="requestReauth()" title="checking session..." style="vertical-align:middle;margin-left:8px;cursor:pointer;"></span>
        <select id="accountSelect" onchange="switchAccount(this.value)" title="Switch account"
                style="float:right;margin-left:8px;font-size:12px;background:#1e1e2e;color:#ccc;border:1px solid #333;border-radius:6px;padding:5px 6px;"></select>
      </h1>

      <div class="tabs">
        <div class="tab active" data-tab="classes">Classes</div>
        <div class="tab" data-tab="watchlist">Your Classes <span id="watchCount"></span></div>
        <div class="tab" data-tab="debug">Debug</div>
      </div>

      <div id="classes" class="tab-content active">
        <div class="nav-bar">
          <div class="nav-group">
            <button class="btn-nav" onclick="changeWeek(-1)">&larr;</button>
            <button class="btn-nav" onclick="goToday()">Today</button>
            <button class="btn-nav" onclick="changeWeek(1)">&rarr;</button>
            <div class="btn-nav" style="position:relative;display:inline-flex;align-items:center;justify-content:center;padding:6px 12px;border-radius:6px;box-sizing:border-box;" title="Pick a date">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <!-- Real date input overlaid invisibly so a tap opens the native picker directly (works on mobile; no showPicker needed) -->
              <input type="date" id="datePicker" aria-label="Pick a date" onchange="pickDate(this.value)"
                     onclick="try{ this.showPicker && this.showPicker(); }catch(e){}"
                     style="position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;margin:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none;">
            </div>
          </div>
          <span class="status" id="classStatus"></span>
          <button class="btn-refresh" id="refreshBtn" onclick="forceRefresh()" title="Force refresh from MindBody">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
          </button>
        </div>
        <div id="classList"><div class="loading">Loading classes...</div></div>
      </div>

      <div id="watchlist" class="tab-content">
        <div id="watchlistContent"><div class="loading">Loading...</div></div>
      </div>

      <div id="debug" class="tab-content">
        <details class="debug-section" open>
          <summary>
            Scheduled Jobs
            <button class="btn-nav" style="margin-left:auto;font-size:0.75rem;padding:4px 10px;"
                    onclick="event.preventDefault();fetchDebugJobs();">Refresh</button>
          </summary>
          <div id="debugJobsContent"><div class="loading">Loading...</div></div>
        </details>

        <details class="debug-section">
          <summary>
            Last Full-Watch Check
            <button class="btn-nav" style="margin-left:auto;font-size:0.75rem;padding:4px 10px;"
                    onclick="event.preventDefault();fetchFullCheck();">Refresh</button>
          </summary>
          <div id="debugFullCheckContent"><div class="loading">Loading...</div></div>
        </details>
      </div>

    </div>

    <div class="toast" id="toast"></div>

    <script>
      // --- Tabs ---
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(tab.dataset.tab).classList.add('active');
          if (tab.dataset.tab === 'watchlist') fetchWatchlist();
          if (tab.dataset.tab === 'debug') { fetchDebugJobs(); fetchFullCheck(); }
          else stopDebugTimers();
        });
      });

      // --- Debug ---
      let _debugTick = null;      // 1s ticker that updates the countdowns live
      let _debugRefresh = null;   // periodic re-fetch so next_run updates after a job fires

      function tickDebugJobs() {
        // Recompute each countdown from its absolute next-run time every second.
        document.querySelectorAll('#debugJobsContent [data-job-next]').forEach(el => {
          const diff = (new Date(el.dataset.jobNext) - new Date()) / 1000;
          el.textContent = formatCountdown(diff);
          // Once a run is due, refetch shortly to pick up the rescheduled next_run.
          if (diff <= 0 && !el.dataset.due) { el.dataset.due = '1'; setTimeout(fetchDebugJobs, 1500); }
        });
      }

      function startDebugTimers() {
        if (_debugTick) clearInterval(_debugTick);
        if (_debugRefresh) clearInterval(_debugRefresh);
        _debugTick = setInterval(tickDebugJobs, 1000);
        _debugRefresh = setInterval(() => { fetchDebugJobs(); fetchFullCheck(); }, 15000);
      }

      function stopDebugTimers() {
        if (_debugTick) { clearInterval(_debugTick); _debugTick = null; }
        if (_debugRefresh) { clearInterval(_debugRefresh); _debugRefresh = null; }
      }

      async function fetchDebugJobs() {
        const el = document.getElementById('debugJobsContent');
        try {
          const res = await fetch('/api/debug/jobs');
          const data = await res.json();
          if (!data.jobs.length) {
            el.innerHTML = '<div class="empty">No scheduled jobs.</div>';
            return;
          }
          let html = `<div class="debug-meta">scheduler ${data.running ? 'running' : 'STOPPED'} · ${data.count} jobs · server time ${new Date(data.now).toLocaleTimeString()}</div>`;
          html += data.jobs.map(j => {
            const when = j.paused
              ? '<span class="job-next paused">paused</span>'
              : `<span class="job-next"><span data-job-next="${j.next_run}">${formatCountdown(j.seconds_until)}</span> · ${new Date(j.next_run).toLocaleString()}</span>`;
            return `<div class="job-row">
              <span class="job-id">${j.id}</span>
              ${when}
              <span class="job-trigger">${j.trigger}</span>
            </div>`;
          }).join('');
          el.innerHTML = html;
          startDebugTimers();
        } catch (e) {
          el.innerHTML = '<div class="empty">Failed to load jobs.</div>';
        }
      }

      async function fetchFullCheck() {
        const el = document.getElementById('debugFullCheckContent');
        try {
          const res = await fetch('/api/debug/full-check');
          const d = await res.json();
          if (!d.ran_at) {
            el.innerHTML = '<div class="empty">Has not run yet since startup.</div>';
            return;
          }
          const s = d.summary;
          const when = new Date(d.ran_at);
          const ago = Math.max(0, Math.round((new Date() - when) / 1000));
          let html = `<div class="debug-meta">ran ${formatCountdown(ago)} ago (${when.toLocaleTimeString()}) · ${d.duration_ms}ms · `
            + `${s.total} searched — <span style="color:#4ade80;">${s.open} open</span>, `
            + `<span style="color:#c084fc;">${s.full} full</span>`
            + (s.other ? `, <span style="color:#fbbf24;">${s.other} other</span>` : '')
            + (d.note ? ` · ${d.note}` : '') + '</div>';
          if (!d.items.length) {
            html += '<div class="empty">No notify-mode watches to check.</div>';
          } else {
            html += d.items.map(i => {
              let cls = 'fc-other', label = i.status;
              if (i.status === 'open') { cls = 'fc-open'; label = `OPEN · ${i.open} spot${i.open === 1 ? '' : 's'}`; }
              else if (i.status === 'full') { cls = 'fc-full'; label = 'FULL'; }
              else { label = i.status.replace('_', ' ').toUpperCase(); }
              return `<div class="fc-row">
                <span class="fc-name">${i.name}</span>
                <span class="fc-badge ${cls}">${label}</span>
                <span class="fc-meta">${i.date} · ${i.time}</span>
              </div>`;
            }).join('');
          }
          el.innerHTML = html;
        } catch (e) {
          el.innerHTML = '<div class="empty">Failed to load.</div>';
        }
      }

      // --- Toast ---
      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
      }

      // --- Classes ---
      let allClasses = [];
      let currentDate = new Date();

      function formatDate(d) {
        return `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;
      }

      function changeWeek(dir) {
        currentDate.setDate(currentDate.getDate() + dir);
        fetchClasses();
      }

      function goToday() {
        currentDate = new Date();
        fetchClasses();
      }

      function pickDate(val) {
        if (!val) return;
        const [y, m, d] = val.split('-').map(Number);
        currentDate = new Date(y, m - 1, d);
        fetchClasses();
      }

      async function fetchClasses(refresh) {
        document.getElementById('classList').innerHTML = '<div class="loading">Loading...</div>';
        try {
          const dateStr = formatDate(currentDate);
          let url = `/api/classes?date=${encodeURIComponent(dateStr)}`;
          if (refresh) url += '&refresh=1';
          const res = await fetch(url);
          allClasses = await res.json();
          if (allClasses.error) throw new Error(allClasses.error);
          renderClasses(allClasses);
          document.getElementById('classStatus').textContent =
            `${allClasses.length} classes · ${dateStr}`;
        } catch (e) {
          document.getElementById('classList').innerHTML =
            `<div class="loading" style="color:#ef4444;">Error: ${e.message}</div>`;
        }
      }

      const LOCK_CLOSED = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
      const LOCK_OPEN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>';

      async function loadAccounts() {
        try {
          const r = await fetch('/api/accounts');
          const d = await r.json();
          const sel = document.getElementById('accountSelect');
          if (!d.accounts || d.accounts.length <= 1) { sel.style.display = 'none'; return; }
          sel.style.display = '';
          sel.innerHTML = d.accounts.map(a =>
            `<option value="${a.id}" ${a.active ? 'selected' : ''}>${a.name}</option>`).join('');
        } catch (e) {}
      }

      async function switchAccount(id) {
        const sel = document.getElementById('accountSelect');
        sel.disabled = true;
        try {
          const r = await fetch('/api/switch-account', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ id }),
          });
          const d = await r.json();
          showToast(d.name ? `Switched to ${d.name}` : 'Switched account');
          await Promise.all([refreshAuthDot(), loadAccounts()]);
          fetchClasses(); fetchWatchlist();
        } catch (e) {
          showToast('Failed to switch account');
        } finally {
          sel.disabled = false;
        }
      }

      async function refreshAuthDot() {
        const icon = document.getElementById('authIcon');
        try {
          const r = await fetch('/api/auth-status');
          const d = await r.json();
          icon.innerHTML = d.authenticated ? LOCK_CLOSED : LOCK_OPEN;
          icon.title = d.authenticated ? 'Authenticated (idsrvauth present) — tap to re-auth' : 'Not authenticated — tap to re-auth';
        } catch (e) {
          icon.title = 'Auth status unknown';
        }
      }

      let _reauthing = false;
      async function requestReauth() {
        if (_reauthing) return;  // ignore rapid double-taps on the lock icon
        _reauthing = true;
        const icon = document.getElementById('authIcon');
        icon.style.opacity = '0.4';
        icon.style.cursor = 'wait';
        try {
          await fetch('/api/request-reauth', { method: 'POST' });
          showToast('Re-auth requested — status will update shortly.');
        } catch (e) {
          showToast('Failed to request re-auth');
        } finally {
          setTimeout(() => {
            _reauthing = false;
            icon.style.opacity = '1';
            icon.style.cursor = 'pointer';
            refreshAuthDot();
          }, 3000);
        }
      }

      async function forceRefresh() {
        const btn = document.getElementById('refreshBtn');
        btn.classList.add('spinning');
        await fetchClasses(true);
        btn.classList.remove('spinning');
        showToast('Refreshed from MindBody');
      }

      function renderClasses(classes) {
        const el = document.getElementById('classList');
        if (!classes.length) { el.innerHTML = '<div class="empty">No classes this week</div>'; return; }

        let html = '';
        let currentDay = '';
        for (const cls of classes) {
          if (cls.date !== currentDay) {
            currentDay = cls.date;
            html += `<div class="day-header">${currentDay}</div>`;
          }

          // Check if class is in the past
          let isPast = false;
          if (cls.class_date) {
            try {
              const timeClean = cls.time.replace(/\u00a0/g, ' ').replace(/\s+[A-Z]{2,4}$/, '').trim();
              const clsDt = new Date(cls.class_date + ' ' + timeClean);
              isPast = clsDt < new Date();
            } catch(e) {}
          }

          const spotsClass = isPast ? 'unknown' : cls.open > 0 ? 'open' : cls.has_signup ? 'full' : 'unknown';
          const spotsText = isPast ? '' : cls.has_signup ? `${cls.open} open` : 'Not yet open';

          const clsJson = JSON.stringify(cls).replace(/"/g,'&quot;');
          let actionBtn = '';
          if (isPast) {
            actionBtn = '';
          } else if (cls.watched) {
            actionBtn = `<button class="btn-unwatch btn-small" onclick="unwatchClass(${clsJson})">Watching</button>`;
          } else if (cls.has_signup && cls.class_id && cls.open > 0) {
            actionBtn = `<button class="btn-book btn-small" onclick="bookClass(${clsJson})">Book</button>`;
          } else if (cls.has_signup && cls.class_id && cls.open === 0) {
            // Full — offer to watch for an opening and text when a spot frees up.
            actionBtn = `<button class="btn-watch btn-small" onclick="watchClass(${clsJson}, 'notify')">Notify</button>`;
          } else {
            actionBtn = `<button class="btn-watch btn-small" onclick="watchClass(${clsJson})">Watch</button>`;
          }

          const rowStyle = isPast ? 'opacity:0.35;' : '';

          html += `
            <div class="class-row" style="${rowStyle}">
              <div>
                <div class="class-time">${cls.time}</div>
                <div class="class-name">${cls.name}</div>
                <div class="class-mobile-meta">${cls.teacher} · <span class="class-spots ${spotsClass}">${spotsText}</span></div>
              </div>
              <div class="class-teacher">${cls.teacher}</div>
              <div class="class-spots ${spotsClass}">${spotsText}</div>
              <div class="class-actions">${actionBtn}</div>
            </div>`;
        }
        el.innerHTML = html;
      }

      async function bookClass(cls) {
        if (!confirm('Book this class now?')) return;
        showToast('Booking...');
        try {
          const res = await fetch('/api/book', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({class_id: cls.class_id, class_date: cls.class_date,
                                  tg: cls.tg, cls_loc: cls.cls_loc}),
          });
          const data = await res.json();
          showToast(data.result || data.error || 'Done');
          fetchClasses();
        } catch (e) { showToast('Error: ' + e.message); }
      }

      async function watchClass(cls, mode) {
        try {
          const body = Object.assign({}, cls, { mode: mode || 'autobook' });
          const res = await fetch('/api/watch', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify(body),
          });
          const data = await res.json();
          const msg = data.status === 'already_watched' ? 'Already watching'
            : (mode === 'notify' ? "Watching — auto-books if a spot opens 24h+ out, texts you either way" : 'Added to watchlist');
          showToast(msg);
          fetchClasses(); fetchWatchlist();
        } catch (e) { showToast('Error: ' + e.message); }
      }

      async function unwatchClass(cls) {
        try {
          await fetch('/api/unwatch', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify(cls),
          });
          showToast('Removed'); fetchClasses(); fetchWatchlist();
        } catch (e) { showToast('Error: ' + e.message); }
      }

      // --- Watchlist ---
      let _watchlistData = [];
      let _countdownInterval = null;

      async function fetchWatchlist() {
        try {
          const res = await fetch('/api/watchlist');
          _watchlistData = await res.json();
          renderWatchlist(_watchlistData);
          startCountdown();
          const waiting = _watchlistData.filter(w => w.status === 'waiting').length;
          document.getElementById('watchCount').textContent = waiting ? `(${waiting})` : '';
        } catch (e) {
          document.getElementById('watchlistContent').innerHTML =
            '<div class="loading" style="color:#ef4444;">Error</div>';
        }
      }

      function formatCountdown(seconds) {
        if (seconds <= 0) return 'now';
        const d = Math.floor(seconds / 86400);
        const h = Math.floor((seconds % 86400) / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (d > 0) return `${d}d ${h}h ${m}m ${s}s`;
        if (h > 0) return `${h}h ${m}m ${s}s`;
        if (m > 0) return `${m}m ${s}s`;
        return `${s}s`;
      }

      function startCountdown() {
        if (_countdownInterval) clearInterval(_countdownInterval);
        _countdownInterval = setInterval(() => {
          const els = document.querySelectorAll('[data-open-time]');
          els.forEach(el => {
            const openTime = new Date(el.dataset.openTime);
            const diff = (openTime - new Date()) / 1000;
            el.textContent = formatCountdown(diff);
          });
        }, 1000);
      }

      // Latest class first; entries without a parseable datetime sink to the bottom.
      function byTimeDesc(a, b) {
        const ta = a.class_dt ? new Date(a.class_dt).getTime() : -Infinity;
        const tb = b.class_dt ? new Date(b.class_dt).getTime() : -Infinity;
        return tb - ta;
      }

      function watchRowHtml(w) {
        // Phase indicator
        const phase = w.phase || 'unknown';
        let dotClass = 'dot-scheduled';

        if (phase === 'done' || w.status === 'booked' || w.status === 'snagged') {
          dotClass = 'dot-done';
        } else if (phase === 'booking') {
          dotClass = 'dot-booking';
        } else if (phase === 'reauth') {
          dotClass = 'dot-reauth';
        }

        // Notify-mode watches (full classes) show a status instead of a countdown.
        if (w.mode === 'notify') {
          if (w.status === 'booked' || w.status === 'opened') dotClass = 'dot-done';
          else if (w.status === 'book_failed' || w.status === 'expired') dotClass = 'dot-reauth';
          else dotClass = 'dot-scheduled';
        }

        let opensHtml = '?';
        if (w.mode === 'notify') {
          if (w.status === 'booked') opensHtml = 'Booked ✓';
          else if (w.status === 'book_failed') opensHtml = 'Book failed';
          else if (w.status === 'opened') opensHtml = `Open — ${(w.texted ?? w.emailed) ? 'texted' : 'text failed'}`;
          else if (w.status === 'expired') opensHtml = 'Class passed';
          else opensHtml = 'Watching for opening';
        } else if (w.status === 'booked' || w.status === 'snagged') {
          opensHtml = 'Booked ✓';
        } else if (w.status === 'expired') {
          opensHtml = 'Class passed';
        } else if (w.open_time) {
          const diff = (new Date(w.open_time) - new Date()) / 1000;
          opensHtml = `<span data-open-time="${w.open_time}">${formatCountdown(diff)}</span>`;
        }

        const rm = w.status !== 'booked' && w.status !== 'snagged'
          ? `<button class="btn-unwatch btn-small" onclick="unwatchByEntry(${JSON.stringify(w).replace(/"/g,'&quot;')})">Remove</button>` : '';

        return `
          <div class="watchlist-item">
            <div>
              <strong>${w.class_name}</strong><br>
              <span style="color:#888;font-size:0.75rem;">${w.teacher||''} · ${w.time || ''}</span>
              <span class="wl-mobile-meta"><span class="phase-dot ${dotClass}"></span>${w.date_label || w.class_date || ''} · ${w.mode === 'notify' ? opensHtml : 'opens ' + opensHtml}</span>
            </div>
            <div class="wl-date">${w.date_label || w.class_date || ''}</div>
            <div class="wl-time"><span class="phase-dot ${dotClass}"></span>${opensHtml}</div>
            <div style="text-align:right;">${rm}</div>
          </div>`;
      }

      function watchTableHtml(list) {
        const header = `<div class="watchlist-item" style="color:#555; font-size:0.75rem; font-weight:600; border-bottom:1px solid #333;">
          <div>Class</div><div class="wl-header-date">Date</div><div class="wl-header-time">Opens</div><div></div>
        </div>`;
        return header + list.map(watchRowHtml).join('');
      }

      function renderWatchlist(list) {
        const el = document.getElementById('watchlistContent');
        if (!list.length) {
          el.innerHTML = '<div class="empty">No watched classes yet.<br>Select classes from the schedule to auto-book when signup opens.</div>';
          return;
        }

        const ARCHIVED = ['booked', 'snagged', 'expired'];
        const active = list.filter(w => !ARCHIVED.includes(w.status)).sort(byTimeDesc);
        const archived = list.filter(w => ARCHIVED.includes(w.status)).sort(byTimeDesc);

        let html = active.length
          ? watchTableHtml(active)
          : '<div class="empty" style="padding:20px;">No upcoming classes — see Booked &amp; expired below.</div>';

        if (archived.length) {
          html += `
            <details class="debug-section" style="margin-top:14px;">
              <summary>Booked &amp; expired (${archived.length})</summary>
              <div>${watchTableHtml(archived)}</div>
            </details>`;
        }
        el.innerHTML = html;
      }

      async function unwatchByEntry(w) {
        try {
          await fetch('/api/unwatch', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({name: w.class_name, class_date: w.class_date, time: w.time}),
          });
          showToast('Removed'); fetchWatchlist(); fetchClasses();
        } catch (e) { showToast('Error: ' + e.message); }
      }

      // --- Init: stream boot logs, then fetch classes ---
      (function boot() {
        refreshAuthDot();
        loadAccounts();
        const el = document.getElementById('classList');
        el.innerHTML = '<div class="boot-log" id="bootLog"></div>';
        const logEl = document.getElementById('bootLog');

        const es = new EventSource('/api/boot-log');
        es.onmessage = function(e) {
          if (e.data === '__DONE__') {
            es.close();
            fetchClasses();
            fetchWatchlist();
            return;
          }
          const line = document.createElement('div');
          line.className = 'log-line';
          line.textContent = e.data;
          logEl.appendChild(line);
          logEl.scrollTop = logEl.scrollHeight;
        };
        es.onerror = function() {
          es.close();
          fetchClasses();
          fetchWatchlist();
        };
      })();
    </script>
  </body>
</html>
